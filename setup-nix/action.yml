name: Setup Nix
description: Install Nix and configure Cachix

inputs:
  github_access_token:
    description: GitHub token for authenticating Nix fetches
    default: ${{ github.token }}
  cachix_name:
    description: Cachix cache name; empty skips Cachix setup
    default: unstoppablemango
  cachix_auth_token:
    description: Cachix authentication token (for pushing to cache)
    required: false
  extra_pull_names:
    description: Comma-separated list of additional Cachix caches to pull from
    default: ''
  extra_nix_config:
    description: Additional Nix configuration lines
    required: false
  use_daemon:
    description: Push through the Cachix daemon's post-build hook; when false, scan and push all store paths at the end of the job. Use false only with an isolated single-user store
    default: "true"
  skip_push:
    description: Pull from Cachix without pushing, even when cachix_auth_token is set
    default: "false"

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github_access_token }}
        extra_nix_config: ${{ inputs.extra_nix_config }}

    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      if: inputs.cachix_name != ''
      with:
        name: ${{ inputs.cachix_name }}
        authToken: ${{ inputs.cachix_auth_token }}
        extraPullNames: ${{ inputs.extra_pull_names }}
        useDaemon: ${{ inputs.use_daemon }}
        skipPush: ${{ inputs.skip_push }}
