name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Newline-delimited list of image names to tag
          (e.g. ghcr.io/owner/repo or docker.io/owner/repo)
        type: string
        required: true
      platforms:
        description: >-
          Comma-separated list of target platforms.
          Defaults to linux/amd64 only; set to linux/amd64,linux/arm64 for multi-arch.
        type: string
        default: linux/amd64
      push:
        description: Push the image after building
        type: boolean
        default: false
      build-args:
        description: Newline-delimited list of build-time variables (KEY=value)
        type: string
        default: ''
      file:
        description: Path to the Dockerfile (default is repo root Dockerfile)
        type: string
        default: ''
      context:
        description: Build context path
        type: string
        default: '.'
    secrets:
      dockerhub_token:
        description: Docker Hub token (required when pushing to docker.io)
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.push && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
