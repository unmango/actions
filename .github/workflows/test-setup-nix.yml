name: Test setup-nix

on:
  pull_request:
    paths:
      - setup-nix/**
      - .github/workflows/test-setup-nix.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-nix

      - run: nix --version

  no-cachix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-nix
        with:
          cachix_name: ''

      - name: Verify Cachix substituter is absent
        run: |
          set -euo pipefail
          nix config show substituters
          ! nix config show substituters | grep -F unstoppablemango

  extra-pull-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-nix
        with:
          extra_pull_names: mangopkgs

      - name: Verify both caches are substituters
        run: |
          set -euo pipefail
          substituters="$(nix config show substituters)"
          echo "$substituters"
          grep -F unstoppablemango <<< "$substituters"
          grep -F mangopkgs <<< "$substituters"

  preinstalled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: ./setup-nix
        with:
          install_nix: 'false'

      - name: Verify Cachix was configured on the existing install
        run: |
          set -euo pipefail
          nix config show substituters | grep -F unstoppablemango

  magic-nix-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-nix
        with:
          magic_nix_cache: 'true'

      - name: Verify the magic-nix-cache daemon is serving
        run: |
          set -euo pipefail
          curl -fsS "http://$MAGIC_NIX_CACHE_ADDRESS/nix-cache-info"
