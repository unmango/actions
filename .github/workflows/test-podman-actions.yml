name: Test Podman Actions

on:
  pull_request:
    paths:
      - podman-login/**
      - podman-build-push/**
      - setup-qemu/**
      - testdata/podman-build-push/**
      - .github/workflows/podman-build-push.yml
      - .github/workflows/test-podman-actions.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: ghcr.io/${{ github.repository }}/podman-actions-test

jobs:
  single-arch:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - id: build
        uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:single-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname

      - name: Verify pushed image
        run: skopeo inspect "docker://${{ env.TEST_IMAGE }}:single-${{ github.run_id }}"

      - name: Verify build secret was not baked into an image layer
        run: |
          set -euo pipefail
          ! podman history --no-trunc "${{ env.TEST_IMAGE }}:single-${{ github.run_id }}" | grep -F "$(cat /etc/hostname)"

  multi-arch:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./setup-qemu

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          platforms: linux/amd64,linux/arm64
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:multi-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname

      - name: Verify pushed manifest has two platform entries
        run: |
          set -euo pipefail
          count="$(skopeo inspect --raw "docker://${{ env.TEST_IMAGE }}:multi-${{ github.run_id }}" | jq '.manifests | length')"
          [ "$count" = "2" ]

  sbom:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:sbom-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname
          sbom: 'true'

      - name: Verify SBOM was attached
        run: cosign tree "${{ env.TEST_IMAGE }}:sbom-${{ github.run_id }}"
