name: Test Podman Actions

on:
  pull_request:
    paths:
      - podman-login/**
      - podman-build-push/**
      - podman-push/**
      - podman-manifest/**
      - setup-qemu/**
      - setup-podman/**
      - testdata/podman-build-push/**
      - .github/workflows/podman-build-push.yml
      - .github/workflows/test-podman-actions.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  TEST_IMAGE: ghcr.io/${{ github.repository }}/podman-actions-test

jobs:
  setup-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: podman
        uses: ./setup-podman
        with:
          start-service: 'true'

      - name: Verify the reported version matches podman
        run: |
          set -euo pipefail
          [ -n "${{ steps.podman.outputs.podman-version }}" ]
          [ "$(podman version --format '{{.Client.Version}}')" = "${{ steps.podman.outputs.podman-version }}" ]
          skopeo --version

  single-arch:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - id: build
        uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:single-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname

      - name: Verify pushed image
        run: skopeo inspect "docker://${{ env.TEST_IMAGE }}:single-${{ github.run_id }}"

      - name: Verify build secret was not baked into an image layer
        run: |
          set -euo pipefail
          ! podman history --no-trunc "${{ env.TEST_IMAGE }}:single-${{ github.run_id }}" | grep -F "$(cat /etc/hostname)"

  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          target: test
          tags: localhost/podman-actions-test:target-${{ github.run_id }}

      - name: Verify the test stage was built
        run: |
          set -euo pipefail
          [ "$(podman run --rm "localhost/podman-actions-test:target-${{ github.run_id }}" cat /stage.txt)" = "test stage" ]

  multi-arch:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./setup-qemu

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          platforms: linux/amd64,linux/arm64
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:multi-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname

      - name: Verify pushed manifest has two platform entries
        run: |
          set -euo pipefail
          count="$(skopeo inspect --raw "docker://${{ env.TEST_IMAGE }}:multi-${{ github.run_id }}" | jq '.manifests | length')"
          [ "$count" = "2" ]

  push:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - name: Build an image outside podman-build-push
        run: podman build --secret id=test,src=/etc/hostname -t localhost/podman-push-test testdata/podman-build-push

      - id: push
        uses: ./podman-push
        with:
          image: localhost/podman-push-test
          tags: |
            ${{ env.TEST_IMAGE }}:push-a-${{ github.run_id }}
            ${{ env.TEST_IMAGE }}:push-b-${{ github.run_id }}

      - name: Verify both tags were pushed with the reported digest
        run: |
          set -euo pipefail
          for t in push-a push-b; do
            digest="$(skopeo inspect --format '{{.Digest}}' "docker://${{ env.TEST_IMAGE }}:$t-${{ github.run_id }}")"
            [ "$digest" = "${{ steps.push.outputs.digest }}" ]
          done

  manifest:
    needs: multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - id: manifest
        uses: ./podman-manifest
        with:
          sources: ${{ env.TEST_IMAGE }}:multi-${{ github.run_id }}
          tags: ${{ env.TEST_IMAGE }}:manifest-${{ github.run_id }}

      - name: Verify the retagged list keeps both platforms
        run: |
          set -euo pipefail
          ref="docker://${{ env.TEST_IMAGE }}:manifest-${{ github.run_id }}"
          [ "$(skopeo inspect --raw "$ref" | jq '.manifests | length')" = "2" ]
          [ "$(skopeo inspect --format '{{.Digest}}' "$ref")" = "${{ steps.manifest.outputs.digest }}" ]

  sbom:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./podman-login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          ecr: 'false'

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign login
        # cosign reads Docker's credential store, not podman's auth file,
        # so it needs its own login even though podman is already authed.
        run: cosign login ghcr.io -u ${{ github.actor }} -p ${{ github.token }}

      - uses: ./podman-build-push
        with:
          context: testdata/podman-build-push
          push: 'true'
          tags: ${{ env.TEST_IMAGE }}:sbom-${{ github.run_id }}
          secrets: id=test,src=/etc/hostname
          sbom: 'true'

      - name: Verify SBOM was attached
        run: cosign tree "${{ env.TEST_IMAGE }}:sbom-${{ github.run_id }}"
