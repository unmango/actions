name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a slower, older run cannot move the floating major tag
# back to an earlier release after a newer run has already moved it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  major-tag:
    # release-please does not move floating major tags, so v1 is re-pointed here
    # to let consumers pin uses: unmango/actions/<action>@v1.
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Move major tag
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "v${MAJOR}" "${SHA}"
          git push -f origin "v${MAJOR}"
