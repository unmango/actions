name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  major-tag:
    # release-please does not move floating major tags, so v1 is re-pointed here
    # to let consumers pin uses: unmango/actions/<action>@v1.
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Move major tag
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "v${MAJOR}" "${SHA}"
          git push -f origin "v${MAJOR}"
