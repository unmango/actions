name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs so a slower, older run cannot move the floating major tag
# back to an earlier release after a newer run has already moved it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  major-tag:
    # release-please does not move floating major tags, so v1 is re-pointed here
    # to let consumers pin uses: unmango/actions/<action>@v1.
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Move major tag
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "v${MAJOR}" "${SHA}"
          git push -f origin "v${MAJOR}"
