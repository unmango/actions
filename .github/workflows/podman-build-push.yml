name: Podman Build and Push

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Newline-delimited list of image names to tag
          (e.g. ghcr.io/owner/repo or docker.io/owner/repo)
        type: string
        required: true
      platforms:
        description: >-
          Comma-separated list of target platforms.
          Defaults to linux/amd64 only; set to linux/amd64,linux/arm64 for multi-arch.
        type: string
        default: linux/amd64
      push:
        description: Push the image after building
        type: boolean
        default: false
      build-args:
        description: Newline-delimited list of build-time variables (KEY=value)
        type: string
        default: ''
      file:
        description: Path to the Containerfile (default is repo root Dockerfile/Containerfile)
        type: string
        default: ''
      context:
        description: Build context path
        type: string
        default: '.'
      secrets-list:
        description: Newline-delimited list of secrets (id=id,src=path)
        type: string
        default: ''
      cache:
        description: 'Cache backend: none, registry, or local'
        type: string
        default: none
      cache-image:
        description: Registry image ref used for the build cache when cache is registry
        type: string
        default: ''
      cache-dir:
        description: Local directory used for the build cache when cache is local
        type: string
        default: /tmp/.podman-cache
      sbom:
        description: Generate and attach an SBOM (requires push)
        type: boolean
        default: false
      provenance:
        description: Not implemented; kept for interface parity with docker-build-push.yml
        type: boolean
        default: false
    secrets:
      dockerhub_token:
        description: Docker Hub token (required when pushing to docker.io)
        required: false

jobs:
  podman:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
    steps:
      - uses: UnstoppableMango/actions/setup-qemu@main
        if: contains(inputs.platforms, ',')

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache == 'local'
        with:
          path: ${{ inputs.cache-dir }}
          key: podman-cache-${{ inputs.image }}-${{ github.sha }}
          restore-keys: podman-cache-${{ inputs.image }}-

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: UnstoppableMango/actions/podman-login@main
        if: inputs.push && env.DOCKERHUB_TOKEN != ''
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          ecr: 'false'

      - uses: UnstoppableMango/actions/podman-login@main
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
          ecr: 'false'

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        if: inputs.sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.sbom

      - name: Cosign login (docker.io)
        # cosign reads Docker's credential store, not podman's auth file,
        # so it needs its own login even though podman is already authed.
        if: inputs.push && inputs.sbom && env.DOCKERHUB_TOKEN != ''
        run: cosign login docker.io -u ${{ github.repository_owner }} -p ${{ env.DOCKERHUB_TOKEN }}

      - name: Cosign login (ghcr.io)
        if: inputs.push && inputs.sbom
        run: cosign login ghcr.io -u ${{ github.repository_owner }} -p ${{ github.token }}

      - uses: UnstoppableMango/actions/podman-build-push@main
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ inputs.secrets-list }}
          cache-from: ${{ inputs.cache == 'registry' && inputs.cache-image || (inputs.cache == 'local' && inputs.cache-dir || '') }}
          cache-to: ${{ inputs.cache == 'registry' && inputs.cache-image || (inputs.cache == 'local' && inputs.cache-dir || '') }}
          sbom: ${{ inputs.sbom }}
          provenance: ${{ inputs.provenance }}
