name: GoReleaser

on:
  workflow_call:
    inputs:
      snapshot:
        description: Run in snapshot mode (no publish, no tag required)
        type: boolean
        default: false
      go-version-file:
        description: Path to go.mod file containing the Go version
        type: string
        default: go.mod
      cache-dependency-path:
        description: Path to go.sum for cache invalidation
        type: string
        default: go.sum

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release ${{ inputs.snapshot && '--snapshot' || '--clean' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
