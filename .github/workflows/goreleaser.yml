name: GoReleaser

on:
  workflow_call:
    inputs:
      snapshot:
        description: Run in snapshot mode (no publish, no tag required)
        type: boolean
        default: false
      go-version-file:
        description: Path to go.mod file containing the Go version
        type: string
        default: go.mod
      cache-dependency-path:
        description: Path to go.sum for cache invalidation
        type: string
        default: go.sum

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release ${{ inputs.snapshot && '--snapshot' || '--clean' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
